{% extends 'layout/base.html' %}
{% load i18n bootstrap4 %}

{% block content %}
    <div class="row">
        <div class="col-12 col-lg-8">
            <div class="card">
                <form method="post">
                    {% csrf_token %}
                    <div class="card-body">
                        {% bootstrap_form form %}
                    </div>
                    <div class="card-footer">
                        <button type="submit" class="btn btn-primary">{% translate 'Save' %}</button>
                        <a class="btn btn-light" href="{% if template.pk %}{% url 'cdd:template_detail' template.pk %}{% else %}{% url 'cdd:template_list' %}{% endif %}">{% translate 'Cancel' %}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
