# Copy to data/nginx/nginx.conf on the VM.
# HTTPS ends at the agency's proxy in front of the VM; this nginx receives plain HTTP on port 80.

# Pass on the scheme the browser used (https from the agency's proxy). Falls back to this
# connection's scheme when the header is missing. Django reads it (SECURE_PROXY_SSL_HEADER).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream django-app-server {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name mis.coso.gouv.bj;
    server_tokens off;

    # Visit photos (~1 MB max) and form attachments; nginx's default is 1 MB.
    client_max_body_size 10m;

    location / {
        proxy_pass http://django-app-server;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    location /static/ {
        alias /var/www/app/static/; # where our static files are hosted
    }

    # Visit photos are never public: the app serves them through /api/v1/visits/<id>/photo/
    # after a permission check.
    location /media/photos/ {
        deny all;
    }

    # Other uploads (form and sub-project attachments), stored on the "media" volume.
    location /media/ {
        alias /var/www/app/media/;
    }

    location /couchdb/ {
        rewrite ^ $request_uri;
        rewrite ^/couchdb/(.*) /$1 break;
        proxy_pass http://10.205.3.45:5984$uri;
        proxy_redirect off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

}
