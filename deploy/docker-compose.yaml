# Production stack for the VM (mis.coso.gouv.bj). Copy this file next to the VM's .env, then:
#   docker compose pull && docker compose up -d
# Changes from the previous VM file: PostGIS image, env_file, media volume, scheduler service,
# Postgres reachable from the VM only.
services:
  django-app:
    image: cosobenin/smp-app:v2.0.1   # bump to the tag you pushed
    restart: always
    ports:
      - '9000:9000'
    # Every variable of the VM's .env reaches the container (no list to keep in sync).
    env_file: .env
    environment:
      # Tied to the volume mount below, so fixed here rather than in .env.
      MEDIA_ROOT: /usr/appserver/media
    volumes:
      - static-content:/usr/appserver/collected_static
      - media:/usr/appserver/media
    depends_on:
      - db

  # Runs the scheduled jobs (20:00 automatic visit close, Monday weekly warning). Same image,
  # checks every 60 s and only runs what is due. Replaces a cron entry on the host.
  scheduler:
    image: cosobenin/smp-app:v2.0.1   # same tag as django-app
    restart: always
    # depends_on only waits for django-app to start, not for its migrations: wait until
    # `migrate --check` reports nothing left to apply, then run the jobs.
    command: ["eval", "until python manage.py migrate --check >/dev/null 2>&1; do sleep 5; done; exec python manage.py run_jobs --loop"]
    env_file: .env
    environment:
      MEDIA_ROOT: /usr/appserver/media
    volumes:
      - media:/usr/appserver/media
    depends_on:
      - db
      - django-app

  db:
    # Postgres 17 on Debian bookworm plus PostGIS, built from deploy/db/Dockerfile: same glibc as the
    # previous postgres:17.0 image, so the existing pg_data volume and its text indexes stay valid.
    # Do not use postgis/postgis:17-* (Debian bullseye, different glibc collation).
    image: cosobenin/smp-db:17-postgis3
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Only from the VM itself (psql, pg_dump); the containers use the internal "db" host.
      - '127.0.0.1:5432:5432'

  nginx:
    image: nginx:alpine
    restart: always
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    ports:
      - '80:80'
      - '443:443'
    network_mode: "host"
    volumes:
      - ./data/nginx:/etc/nginx/conf.d
      - static-content:/var/www/app/static
      - media:/var/www/app/media:ro
    depends_on:
      - django-app

volumes:
  static-content:
  media:
  pg_data:
